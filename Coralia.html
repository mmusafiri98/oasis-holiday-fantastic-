<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Séjour Club Coralia Valeria Dar Atlas Marrakech 4</title>
    <style>
        /* Reset */
        body,
        h1,
        p,
        ul,
        li,
        a,
        button {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
        }

        header {
            background-color: rgb(40, 144, 170);
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            width: 100px;
            height: auto;
        }

        header nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        header nav ul li a {
            text-decoration: none;
            color: white;
        }

        .contact {
            font-size: 0.9rem;
        }

        main {
            padding: 20px;
        }

        .hero {
            text-align: center;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 1.8rem;
        }

        .hero .options button {
            margin: 5px;
            padding: 10px 15px;
            border: 1px solid #ccc;
            background-color: #f8f8f8;
            cursor: pointer;
        }

        .price {
            text-align: center;
            margin: 20px 0;
        }

        .price span {
            font-weight: bold;
            font-size: 1.2rem;
            color: #d80027;
        }

        .cta {
            padding: 10px 20px;
            background-color: rgb(40, 144, 170);
            color: white;
            border: none;
            cursor: pointer;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 20px 0;
        }

        .gallery .main-image img {
            width: 40%;
            /* Ridotto al 40% della larghezza */
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .gallery .thumbnails {
            display: flex;
            gap: 10px;
            /* Distanza tra le immagini di anteprima */
        }

        .gallery .thumbnails img {
            width: 15%;
            /* Ridotto al 15% della larghezza */
            cursor: pointer;
            border-radius: 5px;
        }

        .sub-menu {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .sub-menu a {
            text-decoration: none;
            color: #003580;
            font-weight: bold;
            padding: 5px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f8f8f8;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: rgb(40, 144, 170);
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Voyage en tout securite avec oasis</h1>
        <img src="Logo Oasis .svg" alt="Logo Oasis Journeys" class="logo" />
        <nav>
            <ul>
                <li><a href="#">Destinations</a></li>
                <li><a href="#">Les bons plans</a></li>
                <li><a href="#">Circuits</a></li>
                <li><a href="#">Clubs</a></li>
            </ul>
        </nav>
        <div class="contact">
            <p>Besoin d'aide ? <span>053 28 01 38</span></p>
        </div>
    </header>

    <main>
        <div class="hero">
            <h1>Séjour Club Coralia Valeria Dar Atlas Marrakech 4</h1>
            <p>Crète, Ierapetra</p>
            <div class="options">
                <button>Départ le 19/10/2025</button>
                <button>Paris</button>
                <button>Durée du séjour 3 jours / 2 nuits</button>
                <button>Vol + hôtel</button>
                <button>Tout inclus</button>
            </div>
        </div>
        <div class="price">
            <p>à partir de <span>266€ TTC/pers.</span></p>
            <button class="cta">Voir les tarifs</button>
        </div>

        <section class="gallery">
            <div class="main-image">
                <img src="valeria.jpg" alt="Main Resort Image">
                <img src="vestiti.jpg" alt=" Thumbnail 1">


            </div>
            <div class="thumbnails">
                <img src="fresco.jpg" alt="Thumbnail 2">
                <img src="giovane.jpg" alt="Thumbnail 3">
            </div>
        </section>

        <nav class="sub-menu">
            <a href="#">Résumé</a>
            <a href="#">Dates et Tarifs</a>
            <a href="#">Descriptif</a>
            <a href="#">Localisation</a>
            <a href="#">Destination</a>
        </nav>
    </main>

    <footer>
        <img src="Logo Oasis .svg" alt="Logo Oasis Journeys" class="logo" />
    </footer>

    <script>
        // Cambio immagine nella galleria
        const thumbnails = document.querySelectorAll('.thumbnails img');
        const mainImage = document.querySelector('.main-image img');

        thumbnails.forEach(thumb => {
            thumb.addEventListener('click', () => {
                mainImage.src = thumb.src;
            });
        });
    </script>
</body>

</html>
